name: CPU research checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/lock-cpu-win-py312.txt
          python -m pip install -e . --no-deps
      - name: Verify public release excludes private materials
        run: python scripts/check_release.py
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Type check
        run: python -m mypy src/profilefield
      - name: Unit and smoke tests
        run: python -m pytest -q
