experiment:
  name: syn_lowrank
  seeds: [101, 202, 303, 404, 505]
  output_root: outputs/synthetic
data:
  n_side: 25
  output_dim: 4
  profile_points: 50
  matern_nu: 2.5
  lengthscale: [0.18, 0.28]
  noise_std: 0.05
  jitter: 0.005
  coregionalization:
    - [1.00, 0.85, 0.75, 0.65]
    - [0.85, 1.00, 0.80, 0.70]
    - [0.75, 0.80, 1.00, 0.75]
    - [0.65, 0.70, 0.75, 1.00]
split:
  n_blocks_x: 5
  n_blocks_y: 5
  train_fraction: 0.60
  validation_fraction: 0.20
model:
  kernel_nu: 2.5
  inducing_points: 96
  lmc_latents: 2
  training_steps: 800
  learning_rate: 0.02
  jitter: 0.0001
evaluation:
  posterior_samples: 256
  variogram_bins: 12
  bootstrap_replicates: 2000
