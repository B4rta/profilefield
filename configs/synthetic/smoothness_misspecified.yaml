experiment:
  name: syn_misspec
  seeds: [101, 202, 303, 404, 505]
  output_root: outputs/synthetic
data:
  n_side: 25
  output_dim: 4
  profile_points: 50
  matern_nu: 0.5
  lengthscale: [0.18, 0.28]
  noise_std: 0.05
  jitter: 0.005
  coregionalization:
    - [1.00, 0.55, -0.15, 0.20]
    - [0.55, 1.10, 0.35, -0.10]
    - [-0.15, 0.35, 0.90, 0.30]
    - [0.20, -0.10, 0.30, 0.80]
split:
  n_blocks_x: 5
  n_blocks_y: 5
  train_fraction: 0.60
  validation_fraction: 0.20
model:
  kernel_nu: 2.5
  inducing_points: 96
  lmc_latents: 4
  training_steps: 800
  learning_rate: 0.02
  jitter: 0.0001
evaluation:
  posterior_samples: 256
  variogram_bins: 12
  bootstrap_replicates: 2000
