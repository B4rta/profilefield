experiment:
  name: syn_null
  seeds: [101, 202, 303, 404, 505]
  output_root: outputs/synthetic
data:
  n_side: 25
  output_dim: 4
  profile_points: 50
  matern_nu: 2.5
  lengthscale: [0.18, 0.28]
  noise_std: 0.05
  jitter: 0.005
  require_cross_output_dependence: false
  coregionalization:
    - [1.00, 0.00, 0.00, 0.00]
    - [0.00, 1.10, 0.00, 0.00]
    - [0.00, 0.00, 0.90, 0.00]
    - [0.00, 0.00, 0.00, 0.80]
split: &blocked_split
  n_blocks_x: 5
  n_blocks_y: 5
  train_fraction: 0.60
  validation_fraction: 0.20
model: &matched_model
  kernel_nu: 2.5
  inducing_points: 96
  lmc_latents: 4
  training_steps: 800
  learning_rate: 0.02
  jitter: 0.0001
evaluation: &paper_evaluation
  posterior_samples: 256
  variogram_bins: 12
  bootstrap_replicates: 2000
