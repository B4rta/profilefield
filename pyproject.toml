[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profilefield"
version = "0.2.0"
description = "Coregionalized latent Gaussian processes for environmental profiles"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Mark Barta"}]
dependencies = [
  "gpytorch>=1.13",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "psutil>=6.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.12",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]
gedidb = [
  "gedidb==2026.4.30",
  "geopandas>=1.1.4",
  "shapely>=2.1.2",
  "tiledb>=0.36.1",
  "xarray>=2026.7.0",
]

[project.scripts]
profilefield = "profilefield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
